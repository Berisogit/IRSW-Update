<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#6366f1">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3448/3448609.png">
    <title>IRSW - Red Sea Intelligent Operating System</title>
    <!-- Theme Application Script - Must be before CSS/Tailwind -->
    <script>
      (function() {
        // Create an overlay to display critical uncaught errors
        window.addEventListener('DOMContentLoaded', () => {
          const consoleOverlay = document.createElement('div');
          consoleOverlay.id = 'debug-console';
          consoleOverlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);color:#ef4444;z-index:999999;font-family:monospace;white-space:pre-wrap;padding:30px;overflow-y:auto;display:none;';
          document.body.appendChild(consoleOverlay);
        });

        const oldError = console.error;
        console.error = function(...args) {
          oldError.apply(console, args);
        };

        window.addEventListener('error', function(e) {
          const el = document.getElementById('debug-console');
          if (el) {
            el.style.display = 'block';
            el.innerHTML += '[UNCAUGHT ERROR] ' + e.message + '\n' + (e.error?.stack || '') + '\n';
          }
        });

        window.addEventListener('unhandledrejection', function(e) {
          const reason = e.reason instanceof Error ? e.reason.message : String(e.reason ?? '');
          const message = reason.toLowerCase();
          const isIgnorableViteHmrError = message.includes('websocket closed without opened') || message.includes('failed to connect to websocket');

          if (isIgnorableViteHmrError) {
            return;
          }

          const el = document.getElementById('debug-console');
          if (el) {
            el.style.display = 'block';
            el.innerHTML += '[UNHANDLED PROMISE REJECTION] ' + reason + '\n';
          }
        });
      })();
    </script>
    <script>
      (function() {
        let theme = 'light';
        try { theme = localStorage.getItem('irsw_theme') || 'light'; } catch(e) {}
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        window.process = window.process || { env: { API_KEY: '' } };
        window.global = window.global || window;
      })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      html {
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(99, 102, 241, 0.15); 
        border-radius: 20px;
      }
      body {
        overscroll-behavior-y: none;
        -webkit-font-smoothing: antialiased;
        background-color: #f8fafc;
        overflow: hidden;
        height: 100vh;
        height: -webkit-fill-available;
      }
      .dark body {
        background-color: #020617;
      }
      .glass {
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(32px);
        -webkit-backdrop-filter: blur(32px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      .dark .glass {
        background: rgba(15, 23, 42, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .glass-dark {
        background: rgba(10, 15, 30, 0.9);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        border-right: 1px solid rgba(255, 255, 255, 0.05);
      }
      .mesh-bg {
        background: linear-gradient(-45deg, #f8fafc, #eff6ff, #f5f3ff, #f8fafc);
        background-size: 400% 400%;
        animation: mesh 15s ease infinite;
      }
      .dark .mesh-bg {
        background: linear-gradient(-45deg, #020617, #0f172a, #1e1b4b, #020617);
        background-size: 400% 400%;
      }
      .stagger-in > * {
        animation: fadeInSlide 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0;
      }
      @keyframes fadeInSlide {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .pt-safe { padding-top: env(safe-area-inset-top); }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
      
      .premium-text-gradient {
        background: linear-gradient(135deg, #4f46e5, #9333ea);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    </style>
  </head>
  <body class="mesh-bg text-slate-900 dark:text-slate-100 font-sans selection:bg-brand-500/10 selection:text-brand-700">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
